plugins { id 'com.android.application' }
// Same version as the Windows app, from the root Cargo.toml: every release ships both.
// The version code must grow with each release: 2.8.3 becomes 20803.
def appVersion = (file('../../Cargo.toml').text =~ /(?m)^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"/)[0]
def appVersionName = "${appVersion[1]}.${appVersion[2]}.${appVersion[3]}"
def appVersionCode = appVersion[1].toInteger() * 10000 + appVersion[2].toInteger() * 100 + appVersion[3].toInteger()

// The release key never goes in the repository: the Release workflow passes it through these
// variables, from the repository secrets. Without them only debug builds can be made.
def keystore = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace 'org.telcoray.digitaldetox'
    compileSdk 36
    ndkVersion '28.2.13676358'
    defaultConfig { applicationId 'org.telcoray.digitaldetox'; minSdk 30; targetSdk 36; versionCode appVersionCode; versionName appVersionName }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig keystore ? signingConfigs.release : null } }
}

// Build the native Sync worker from the same sources as Windows; no prebuilt libraries in Git.
def rustBuild = tasks.register('compileRustSync', Exec) {
    workingDir '../native'
    commandLine 'cargo', 'build', '--locked', '--release', '--target', 'aarch64-linux-android'
    inputs.files(fileTree('../native/src'), file('../native/build.rs'), file('../native/Cargo.toml'), file('../native/Cargo.lock'), fileTree('../../src/sync'))
    outputs.file('../native/target/aarch64-linux-android/release/libdigital_detox_android.so')
    doFirst {
        def windows = System.getProperty('os.name').toLowerCase().contains('windows')
        def host = windows ? 'windows-x86_64' : System.getProperty('os.name').toLowerCase().contains('mac') ? 'darwin-x86_64' : 'linux-x86_64'
        def compiler = new File(android.sdkDirectory, "ndk/${android.ndkVersion}/toolchains/llvm/prebuilt/${host}/bin/aarch64-linux-android28-clang" + (windows ? '.cmd' : ''))
        environment 'CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER', compiler.absolutePath
    }
}
def copyRust = tasks.register('copyRustSync', Copy) {
    dependsOn rustBuild
    from '../native/target/aarch64-linux-android/release/libdigital_detox_android.so'
    into 'src/main/jniLibs/arm64-v8a'
}
tasks.named('preBuild').configure { dependsOn copyRust }

 dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }

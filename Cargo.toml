[package]
name = "digital-detox"
version = "2.4.1"
edition = "2024"
description = "Locks your screen for a set amount of time, so you actually take that break"
authors = ["telcoray"]
license = "MIT"
repository = "https://github.com/telcoray/DigitalDetox"

[dependencies]
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
# Default features turned off so the text renderer can be chosen below
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "accessibility", "compat-1-2", "unstable-winit-030"] }
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_Globalization", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Accessibility", "Win32_System_Registry"] }
wmi = "0.18.4"

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.31"

[features]
# Software renderer by default: sharp text, ~5 MB of memory instead of ~145 MB with Skia
default = ["software"]
# Lightweight OpenGL renderer (Slint's default)
femtovg = ["slint/renderer-femtovg"]
# Skia renderer (the one used by Chrome): sharper text, bigger executable
skia = ["slint/renderer-skia"]
# CPU-only renderer: no graphics driver loaded, so much less memory
software = ["slint/renderer-software", "slint/software-renderer-systemfonts"]

[profile.release]
# Smaller, faster executable: whole-program optimization and no debug symbols
lto = true
codegen-units = 1
strip = true

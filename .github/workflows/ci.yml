# Builds, tests and lints every push and pull request to main.
# The optimized executable is kept as a downloadable artifact for a few days.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Reuses compiled dependencies between runs: a cold build takes several minutes
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Clippy
        run: cargo clippy --release --locked -- -D warnings

      - uses: actions/upload-artifact@v4
        with:
          name: digital-detox-${{ github.sha }}
          path: target/release/digital-detox.exe
          retention-days: 7

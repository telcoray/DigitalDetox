# Pushing a tag like v2.4.0 builds the release zip, the installer and the Android APK, and
# creates a *draft* GitHub release with all three. The notes are then written and the release is published by hand,
# after a final check.
#
# Run it by hand (Actions → Release → Run workflow) to only build the files, as an artifact,
# without creating any release.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Read the version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            Write-Error "Tag $env:GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          }

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      # Same layout as the releases made by hand: DigitalDetox.exe + LICENSE
      - name: Package
        id: package
        shell: pwsh
        run: |
          $zip = "DigitalDetox-v${{ steps.version.outputs.version }}-win-x64.zip"
          New-Item -ItemType Directory -Force package, dist | Out-Null
          Copy-Item target/release/digital-detox.exe package/DigitalDetox.exe
          Copy-Item LICENSE package/
          Compress-Archive -Path package/* -DestinationPath "dist/$zip"
          "zip=dist/$zip" >> $env:GITHUB_OUTPUT

      # Inno Setup may not be preinstalled on the runner image
      - name: Build installer
        id: installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          & $iscc /Q "/DAppVersion=${{ steps.version.outputs.version }}" installer\DigitalDetox.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "DigitalDetox-v${{ steps.version.outputs.version }}-setup-x64.exe"
          Move-Item "release/$setup" "dist/$setup"
          "setup=dist/$setup" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: windows-files
          path: dist/

  # The APK takes its version from the same Cargo.toml (see android/app/build.gradle), and is
  # signed with the release key kept in the repository secrets: an update installs over the
  # previous version only if both are signed with the same key.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/native

      # The runner has the Android SDK, but not necessarily this NDK version
      - name: Install the NDK
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null

      - name: Test the Sync bridge
        run: cargo test --manifest-path native/Cargo.toml --locked

      - name: Build and sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing: the APK can't be signed"
            exit 1
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          ./gradlew assembleRelease testReleaseUnitTest --no-daemon
          rm "$ANDROID_KEYSTORE_FILE"

      - name: Package
        run: |
          version=$(grep -m1 '^version' ../Cargo.toml | cut -d '"' -f2)
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/DigitalDetox-v$version-android-arm64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-files
          path: dist/

  # Only once both builds have worked, so a release never lacks one of the files
  draft:
    if: github.ref_type == 'tag'
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Digital Detox $GITHUB_REF_NAME" \
            --notes "Release notes to be written before publishing."
